[project]
name = "fantasy-api"
version = "0.1.0"
description = "Read-only Lambda handlers serving fantasy-dashboard data to the frontend"
readme = "README.md"
authors = [
    { name = "froilanbuendia", email = "froilangbuendia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.74",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
